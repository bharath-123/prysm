syntax = "proto3";

package ethereum.engine.v1;

import "proto/engine/v1/execution_engine.proto";

option csharp_namespace = "Ethereum.Engine.V1";
option go_package = "github.com/OffchainLabs/prysm/v7/proto/engine/v1;enginev1";
option java_multiple_files = true;
option java_outer_classname = "ElectraProto";
option java_package = "org.ethereum.engine.v1";
option php_namespace = "Ethereum\\Engine\\v1";

message ExecutionBundleFulu {
  ExecutionPayloadDeneb payload = 1;
  bytes value = 2;
  BlobsBundleV2 blobs_bundle = 3;
  bool should_override_builder = 4;
  repeated bytes execution_requests = 5;
}

message ExecutionBundleGloas {
  ExecutionPayloadGloas payload = 1;
  bytes value = 2;
  BlobsBundleV2 blobs_bundle = 3;
  bool should_override_builder = 4;
  repeated bytes execution_requests = 5;
  // aot_blob_bundle carries the AOT (ahead-of-time) blob commitments + cell proofs
  // included in the payload, returned by engine_getPayload (Blob Streaming). The
  // blobs_bundle above is JIT-only; this is the AOT counterpart. Empty when the
  // payload includes no AOT blobs (e.g. the AOT blob txs are not in the mempool).
  // Wire/JSON key in the getPayload response: aotBlobInfo.
  repeated AotBlobBundleV1 aot_blob_bundle = 6;
}
