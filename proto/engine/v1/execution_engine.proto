message PayloadAttributes {
  uint64 timestamp = 1;
  bytes prev_randao = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes suggested_fee_recipient = 3 [ (ethereum.eth.ext.ssz_size) = "20" ];
}

message PayloadAttributesV2 {
  uint64 timestamp = 1;
  bytes prev_randao = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes suggested_fee_recipient = 3 [ (ethereum.eth.ext.ssz_size) = "20" ];
  repeated Withdrawal withdrawals = 4
      [ (ethereum.eth.ext.ssz_max) = "withdrawal.size" ]; // New in Capella.
}

message PayloadAttributesV3 {
  uint64 timestamp = 1;
  bytes prev_randao = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes suggested_fee_recipient = 3 [ (ethereum.eth.ext.ssz_size) = "20" ];
  repeated Withdrawal withdrawals = 4
      [ (ethereum.eth.ext.ssz_max) = "withdrawal.size" ];
  bytes parent_beacon_block_root = 5 [ (ethereum.eth.ext.ssz_size) = "32" ];
}

// VersionedHashList wraps one AOT bundle's blob versioned hashes so that
// PayloadAttributesV4.available_aot_blob_commitments can express a list-of-lists
// (one inner list per available AOT bundle). proto3 has no repeated-of-repeated,
// hence the wrapper. JSON/SSZ generation is not used for PayloadAttributes (it is
// sent to the EL as JSON), so no ssz tags are needed here.
message VersionedHashList {
  repeated bytes versioned_hashes = 1;
}

// PayloadAttributesV4 extends V3 with slot_number (Amsterdam/EIP-7843).
message PayloadAttributesV4 {
  uint64 timestamp = 1;
  bytes prev_randao = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes suggested_fee_recipient = 3 [ (ethereum.eth.ext.ssz_size) = "20" ];
  repeated Withdrawal withdrawals = 4
      [ (ethereum.eth.ext.ssz_max) = "withdrawal.size" ];
  bytes parent_beacon_block_root = 5 [ (ethereum.eth.ext.ssz_size) = "32" ];
  uint64 slot_number = 6;
  // available_aot_blob_commitments carries, per available AOT bundle, the blob
  // versioned hashes whose custody this node has fulfilled (Blob Streaming POC:
  // a list-of-lists of versioned hashes, sourced from the AOT data column cache).
  // Wire/JSON field name: availableAotBlobCommitments.
  repeated VersionedHashList available_aot_blob_commitments = 7;
}

message PayloadStatus {
  Status status = 1;
  bytes latest_valid_hash = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  string validation_error = 3;
  enum Status {
    UNKNOWN = 0;
    VALID = 1;
    INVALID = 2;
    SYNCING = 3;
    ACCEPTED = 4;
    INVALID_BLOCK_HASH = 5;
  }
}

message ForkchoiceState {
  bytes head_block_hash = 1 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes safe_block_hash = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes finalized_block_hash = 3 [ (ethereum.eth.ext.ssz_size) = "32" ];
}

// The withdrawal receipt with the recipient address and amount withdrawn
message Withdrawal {
  // Withdrawal index for accounting purposes
  uint64 index = 1;

  // Validator index for the withdrawal
  uint64 validator_index = 2
      [ (ethereum.eth.ext.cast_type) =
            "github.com/OffchainLabs/prysm/v7/consensus-types/"
            "primitives.ValidatorIndex" ];

  // The execution address receiving the funds
  bytes address = 3 [ (ethereum.eth.ext.ssz_size) = "20" ];

  // The withdrawn amount in Gwei
  uint64 amount = 4;
}

// BlobsBundle is retrieved through engine-api from the execution layer client.
// It consists of the necessary components for constructing blob sidecars
// objects to gossip through p2p.
message BlobsBundle {
  // The KZG commitments of the blobs.
  repeated bytes kzg_commitments = 1 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];

  // The proofs of the blobs.
  repeated bytes proofs = 2 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];

  // The blobs itself.
  repeated bytes blobs = 3 [
    (ethereum.eth.ext.ssz_size) = "?,blob.size",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];
}

// BlobsBundleV2 is retrieved through engine-api from the execution layer
// client. It consists of the necessary components for constructing data column
// sidecars objects to gossip through p2p. It is introduced in Fulu network
// upgrade.
message BlobsBundleV2 {
  repeated bytes kzg_commitments = 1 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];

  repeated bytes proofs = 2 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) =
        "max_cell_proofs_length.size" // Changed in EIP-7594
  ];

  repeated bytes blobs = 3 [
    (ethereum.eth.ext.ssz_size) = "?,blob.size",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];
}

// Blob contains the data that is to be committed on chain.
message Blob {
  // The blob bytes.
  bytes data = 1 [ (ethereum.eth.ext.ssz_size) = "blob.size" ];
}

// AOTBlobInfo contains the metadata for an AOT (ahead-of-time) blob submission
// associated with a blob ticket, introduced by the Blob Streaming EIP. The
// ticket holder signs this (see SignedAOTBlobInfo / the blob_info_signature on
// AOTDataColumnSidecar) before computing and distributing the corresponding
// data columns.
//
// Spec:
// class AOTBlobInfo(Container):
//     ticket_id: TicketId
//     target_slot: Slot
//     blob_kzg_commitments: List[KZGCommitment, MAX_AOT_BLOB_COMMITMENTS_PER_BLOCK]
message AOTBlobInfo {
  uint64 ticket_id = 1;
  uint64 target_slot = 2 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  repeated bytes blob_kzg_commitments = 3 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_aot_blob_commitments.size"
  ];
}

// AotBlobBundleV1 describes a single AOT (ahead-of-time) blob whose commitment and
// cell proofs are included in the execution payload, returned by engine_getPayload
// alongside the payload and the (JIT-only) BlobsBundleV2. Unlike JIT blobs, the EL
// does not hold the AOT blob data; the CL is responsible for its data availability
// via the sidecar subnets. JSON-only transport from the EL, so no ssz tags.
//
// Engine API (execution-apis blob-streaming.md, AotBlobBundleV1):
//   versionedHash: DATA, 32 Bytes
//   kzgCommitment: DATA, 48 Bytes
//   kzgProofs:     Array of KZGProof (48 Bytes each), exactly CELLS_PER_EXT_BLOB proofs
message AotBlobBundleV1 {
  bytes versioned_hash = 1;
  bytes kzg_commitment = 2;
  repeated bytes kzg_proofs = 3;
}

// BlobAndProofV2 consists of the blob and the cell proofs for each cell in the
// blob.
message BlobAndProof {
  bytes blob = 1 [ (ethereum.eth.ext.ssz_size) = "blob.size" ];
  bytes kzg_proof = 2 [ (ethereum.eth.ext.ssz_size) = "48" ];
}

// BlobAndProofV2 consists of the blob and the cell proofs for each cell in the
// blob. It is introduced in Fulu network upgrade.
message BlobAndProofV2 {
  bytes blob = 1 [ (ethereum.eth.ext.ssz_size) = "blob.size" ];
  repeated bytes kzg_proofs = 2 [
    (ethereum.eth.ext.ssz_size) = "48",
    (ethereum.eth.ext.ssz_max) = "max_cell_proofs_length.size"
  ];
}